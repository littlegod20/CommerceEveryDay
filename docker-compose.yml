services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce_everyday
    ports:
      - "5433:5432"
    volumes:
      - commerce_everyday_pgdata:/var/lib/postgresql/data

volumes:
  commerce_everyday_pgdata:
